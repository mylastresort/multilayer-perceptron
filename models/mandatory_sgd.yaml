learning_rate: 0.01
epochs: 1250
batch_size: 16
optimizer: sgd
loss: binary_cross_entropy

input_layers:
  - size: 30

hidden_layers:
  - size: 24
    activation: sigmoid
    initializer: xavier
  - size: 12
    activation: sigmoid
    initializer: xavier

output_layers:
  - size: 2
    activation: softmax
    initializer: xavier
