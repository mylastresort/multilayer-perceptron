# Bonus: multiple curves — monitor several metrics during training.
# The train subcommand monitors loss, accuracy and precision together
# (--monitor-metrics loss,accuracy,precision) and renders each metric's
# training/validation curve on a single stacked graph, so every metric is
# visible at a glance.
learning_rate: 0.001
epochs: 250
batch_size: 16
optimizer: adam
loss: binary_cross_entropy

input_layers:
  - size: 30

hidden_layers:
  - size: 24
    activation: relu
    initializer: he
  - size: 12
    activation: relu
    initializer: he

output_layers:
  - size: 2
    activation: softmax
    initializer: xavier
