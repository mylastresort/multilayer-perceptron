# Bonus: precision-driven monitoring of the learning phase.
# The train subcommand watches precision as the early-stopping metric
# (--early-stop-metric precision) while still plotting loss, accuracy and
# precision curves, so the model is chosen by the metric you want to optimize.
learning_rate: 0.001
epochs: 250
batch_size: 16
optimizer: adam
loss: binary_cross_entropy

input_layers:
  - size: 30

hidden_layers:
  - size: 24
    activation: relu
    initializer: he
  - size: 12
    activation: relu
    initializer: he

output_layers:
  - size: 2
    activation: softmax
    initializer: xavier
