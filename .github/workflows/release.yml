name: Release

on:
  push:
    branches: [main]

jobs:
  release-please:
    name: Release & Changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name:        ${{ steps.rp.outputs.tag_name }}
      major:           ${{ steps.rp.outputs.major }}
      minor:           ${{ steps.rp.outputs.minor }}
      patch:           ${{ steps.rp.outputs.patch }}
      html_url:        ${{ steps.rp.outputs.html_url }}

    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          release-type: simple
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ─────────────────────────────────────────────────────────────────
  # Runs ONLY when the release PR was merged (not on every push).
  # Add your own deploy / build / publish steps here.
  # ─────────────────────────────────────────────────────────────────
  on-release:
    name: Post-release
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Log release info
        run: |
          echo "✅ Released ${{ needs.release-please.outputs.tag_name }}"
          echo "   major : ${{ needs.release-please.outputs.major }}"
          echo "   minor : ${{ needs.release-please.outputs.minor }}"
          echo "   patch : ${{ needs.release-please.outputs.patch }}"
          echo "   url   : ${{ needs.release-please.outputs.html_url }}"

      # - name: Deploy to production
      #   run: echo "Add your deploy command here"
