name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  check-perf-commit:
    name: Check for perf commits
    runs-on: ubuntu-latest
    outputs:
      has_perf: ${{ steps.check.outputs.has_perf }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect perf commits
        id: check
        run: |
          if git log --format="%s" origin/main..HEAD | grep -qE "^perf(\(.+\))?:"; then
            echo "has_perf=true" >> $GITHUB_OUTPUT
          elif git log -1 --format="%s" | grep -qE "^perf(\(.+\))?:"; then
            echo "has_perf=true" >> $GITHUB_OUTPUT
          else
            echo "has_perf=false" >> $GITHUB_OUTPUT
            echo "No perf commits found — skipping benchmarks"
          fi

  bench-throughput:
    name: Throughput
    needs: check-perf-commit
    if: needs.check-perf-commit.outputs.has_perf == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run throughput benchmark
        run: |
          # Replace with your benchmark command, e.g.:
          # go test -bench=BenchmarkThroughput -benchmem ./... | tee throughput.txt
