name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  check-perf-commit:
    name: Check for perf commits
    runs-on: ubuntu-latest
    outputs:
      has_perf: ${{ steps.check.outputs.has_perf }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect perf commits
        id: check
        run: |
          if git log --format="%s" origin/main..HEAD | grep -qE "^perf(\(.+\))?:"; then
            echo "has_perf=true" >> $GITHUB_OUTPUT
          elif git log -1 --format="%s" | grep -qE "^perf(\(.+\))?:"; then
            echo "has_perf=true" >> $GITHUB_OUTPUT
          else
            echo "has_perf=false" >> $GITHUB_OUTPUT
            echo "No perf commits found — skipping benchmarks"
          fi

  bench:
    name: Cargo Benchmarks
    needs: check-perf-commit
    if: needs.check-perf-commit.outputs.has_perf == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bench-

      - name: Run benchmarks
        run: |
          cargo bench --bench '*' -- --output-format bencher | tee bench-output.txt

      # Uncomment once you have benches/ set up in your Cargo project
      # - uses: benchmark-action/github-action-benchmark@v1
